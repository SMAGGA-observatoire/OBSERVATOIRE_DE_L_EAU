<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Observatoire de l'Eau</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f7fa;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    h2 {
      margin-top: 40px;
      border-left: 5px solid #2c7be5;
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-decoration: none;
      color: black;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      background: #e9f2ff;
      color: #2c7be5;
      padding: 3px 8px;
      border-radius: 5px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <h1>🌊 Observatoire de l'Eau</h1>

  <!-- PIÉZOMÉTRIE -->
  <h2>💧 Piézométrie</h2>
  <div class="grid">
    <a class="card" href="graphs/piezo_VOURLES.html">
      <span class="tag">Piézométrie</span><br>
      VOURLES
    </a>
  </div>

  <!-- PLUVIOMÉTRIE -->
  <h2>🌧️ Pluviométrie</h2>
  <div class="grid">

    <a class="card" href="graphs/pluvio_BRINDAS.html">
      <span class="tag">Pluie</span><br>
      Brindas
    </a>

    <a class="card" href="graphs/pluvio_MORNANT.html">
      <span class="tag">Pluie</span><br>
      Mornant
    </a>

    <a class="card" href="graphs/pluvio_STGENIS.html">
      <span class="tag">Pluie</span><br>
      St-Genis-Laval
    </a>

  </div>

  <!-- DÉBIT -->
  <h2>🌊 Débit</h2>
  <div class="grid">

    <a class="card" href="graphs/debit_BRIGNAIS.html">
      <span class="tag">Débit</span><br>
      Brignais
    </a>

    <a class="card" href="graphs/debit_MESSIMY.html">
      <span class="tag">Débit</span><br>
      Messimy
    </a>

    <a class="card" href="graphs/debit_PONT_ROMPU.html">
      <span class="tag">Débit</span><br>
      Pont Rompu
    </a>

  </div>

</body>
</html>
